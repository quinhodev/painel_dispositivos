<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Dispositivos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Painel de Dispositivos</h1>
      <p>Monitoramento e cadastro de telas / players</p>
    </div>
  </header>

  <main>
    <!-- Faixa de aviso de erro: fica escondida por padrão e só aparece via JS
         quando alguma chamada à API falha (ex: back-end fora do ar) -->
    <div id="mensagem-erro" class="mensagem-erro" hidden></div>

    <section class="painel-form">
      <h2>Novo dispositivo</h2>
      <form id="form-dispositivo">
        <input type="text" id="input-nome" placeholder="Nome (ex: Totem Entrada)" required />
        <input type="text" id="input-local" placeholder="Local (ex: Loja Centro)" required />
        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="painel-lista">
      <!-- AC2: busca por nome e filtros por local e status.
           As opções do select de locais são preenchidas via script.js (GET /locais). -->
      <div class="filtros">
        <input type="text" id="input-busca" placeholder="Buscar por nome..." />
        <select id="filtro-local">
          <option value="">Todos os locais</option>
        </select>
        <select id="filtro-status">
          <option value="">Todos os status</option>
          <option value="online">Online</option>
          <option value="offline">Offline</option>
        </select>
      </div>

      <table id="tabela-dispositivos">
        <thead>
          <!-- AC2: clicar em um cabeçalho com data-coluna ordena a tabela por aquela coluna -->
          <tr>
            <th data-coluna="nome">Nome <span class="seta"></span></th>
            <th data-coluna="local">Local <span class="seta"></span></th>
            <th data-coluna="status">Status <span class="seta"></span></th>
            <th data-coluna="ultima_sincronizacao">Última sincronização <span class="seta"></span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- linhas geradas via script.js -->
        </tbody>
      </table>
      <p id="lista-vazia" class="lista-vazia" hidden>Nenhum dispositivo encontrado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
