<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Dispositivos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Painel de Dispositivos</h1>
      <p>Monitoramento e cadastro de telas / players</p>
    </div>

    <!-- FINAL: dashboard (métricas gerais) e botão de sair. Só aparecem depois do login. -->
    <div class="topbar-acoes" id="topbar-acoes" hidden>
      <div class="resumo">
        <div class="resumo-item">
          <span class="resumo-valor" id="resumo-total">0</span>
          <span class="resumo-rotulo">cadastrados</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-valor online" id="resumo-online">0</span>
          <span class="resumo-rotulo">online</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-valor offline" id="resumo-offline">0</span>
          <span class="resumo-rotulo">offline</span>
        </div>
        <div class="resumo-item">
          <span class="resumo-valor percentual" id="resumo-percentual">0%</span>
          <span class="resumo-rotulo">% online</span>
        </div>
      </div>
      <button type="button" id="botao-sair" class="secundario">Sair</button>
    </div>
  </header>

  <!-- FINAL: tela de login. O script.js decide se mostra o login ou o painel. -->
  <section id="tela-login" class="tela-login" hidden>
    <div class="painel-login">
      <h2>Entrar no painel</h2>
      <p>Informe o usuário e a senha para acessar os dispositivos.</p>
      <form id="form-login">
        <input type="text" id="input-usuario" placeholder="Usuário" autocomplete="username" required />
        <input type="password" id="input-senha" placeholder="Senha" autocomplete="current-password" required />
        <p id="login-erro" class="login-erro" hidden></p>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </section>

  <main id="conteudo-principal" hidden>
    <!-- Faixa de aviso de erro: fica escondida por padrão e só aparece via JS
         quando alguma chamada à API falha (ex: back-end fora do ar) -->
    <div id="mensagem-erro" class="mensagem-erro" hidden></div>

    <section class="painel-form">
      <h2>Novo dispositivo</h2>
      <form id="form-dispositivo">
        <input type="text" id="input-nome" placeholder="Nome (ex: Totem Entrada)" required />
        <input type="text" id="input-local" placeholder="Local (ex: Loja Centro)" required />
        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="painel-lista">
      <!-- AC2: busca por nome e filtros por local e status.
           As opções do select de locais são preenchidas via script.js (GET /locais). -->
      <div class="filtros">
        <input type="text" id="input-busca" placeholder="Buscar por nome..." />
        <select id="filtro-local">
          <option value="">Todos os locais</option>
        </select>
        <select id="filtro-status">
          <option value="">Todos os status</option>
          <option value="online">Online</option>
          <option value="offline">Offline</option>
        </select>
        <!-- FINAL: exporta em CSV o que está na tela (mesmos filtros e ordenação) -->
        <button type="button" id="botao-exportar" class="secundario">Exportar CSV</button>
      </div>

      <table id="tabela-dispositivos">
        <thead>
          <!-- AC2: clicar em um cabeçalho com data-coluna ordena a tabela por aquela coluna -->
          <tr>
            <th data-coluna="nome">Nome <span class="seta"></span></th>
            <th data-coluna="local">Local <span class="seta"></span></th>
            <th data-coluna="status">Status <span class="seta"></span></th>
            <th data-coluna="ultima_sincronizacao">Última sincronização <span class="seta"></span></th>
            <!-- AC3: tempo desde a última sincronização (atualiza sozinho a cada segundo) -->
            <th>Há quanto tempo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- linhas geradas via script.js -->
        </tbody>
      </table>
      <p id="lista-vazia" class="lista-vazia" hidden>Nenhum dispositivo encontrado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
